[defaults]
# Desactiva la comprobación de huellas digitales SSH (evita el prompt yes/no)
host_key_checking = False

# Limpia la salida ocultando advertencias de versiones futuras
deprecation_warnings = False

# Oculta advertencias del sistema (ayuda a limpiar el log en Docker)
system_warnings = False

# Evita que se creen archivos .retry cuando falla una tarea
retry_files_enabled = False

# Selección automática del intérprete de Python sin warnings
interpreter_python = auto_silent

# =================================================================
# CAMBIO PRINCIPAL: INVENTARIO DINÁMICO
# =================================================================
# Ahora apuntamos directamente a nuestro script de Python
inventory = ../scripts/dynamic_inventory.py

# NUEVO: Guardamos un log local. Si el dashboard en PHP no muestra 
# suficiente detalle del error, este archivo tendrá la verdad absoluta.
log_path = ./ansible.log

[persistent_connection]
# =================================================================
# CONFIGURACIÓN CRÍTICA PARA DISPOSITIVOS LEGACY
# =================================================================
# Le dice a Ansible que use Paramiko como la opción OFICIAL para 
# conexiones persistentes (network_cli). Es vital para Cisco IOS viejos.
ssh_type = paramiko

# Aumentamos los tiempos de espera para switches lentos
command_timeout = 60
connect_timeout = 60

[paramiko_connection]
# Optimizaciones para Paramiko
# No buscar claves privadas en el sistema (mejora velocidad)
look_for_keys = False

# Acepta automáticamente las claves de host nuevas
host_key_auto_add = True

# No guardar las claves en el archivo known_hosts (mantiene limpio el contenedor)
record_host_keys = False