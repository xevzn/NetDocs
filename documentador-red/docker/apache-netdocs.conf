# Configuración de Apache para NetDocs (H-06).
# El proyecto completo se monta en /var/www/html/documentador-red, pero SOLO public/ se publica.
# Así init.sql, config/, .env, automation/backups, ansible.log, etc. nunca son accesibles por URL.

ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Nada del proyecto se sirve directamente...
<Directory /var/www/html/documentador-red>
    Options -Indexes
    AllowOverride None
    Require all denied
</Directory>

# ...salvo public/, publicado bajo /documentador-red
Alias /documentador-red /var/www/html/documentador-red/public
<Directory /var/www/html/documentador-red/public>
    Options -Indexes
    AllowOverride None
    Require all granted
    DirectoryIndex index.php
    # Toda ruta que no sea un archivo existente la resuelve el enrutador PHP
    FallbackResource /documentador-red/index.php
</Directory>

# Defensa adicional: nunca servir estos tipos aunque lleguen a public/
<FilesMatch "(^\.|\.(sql|log|bak|ini|yml|yaml|cfg|env|md|py|pyc|csv|txt)$)">
    Require all denied
</FilesMatch>

RedirectMatch ^/$ /documentador-red/
