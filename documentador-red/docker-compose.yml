version: '3.8'

services:
  # 1. El Súper-Contenedor (PHP + Apache + Python + Ansible)
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: netdocs_app
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html/documentador-red
    environment:
      - ANSIBLE_HOST_KEY_CHECKING=False
      - TZ=America/Mexico_City
      - INIT_ADMIN_USER=${INIT_ADMIN_USER}
      - INIT_ADMIN_PASS=${INIT_ADMIN_PASS}
      - INIT_ADMIN_EMAIL=${INIT_ADMIN_EMAIL}
      - VAULT_MASTER_KEY=${VAULT_MASTER_KEY:?Set VAULT_MASTER_KEY in the environment}
      - MYSQL_HOST=db
      - MYSQL_USER=${MYSQL_USER:?Set MYSQL_USER in the environment}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the environment}
      - MYSQL_DATABASE=red_infraestructura
    depends_on:
      - db

  # 2. Contenedor de Base de Datos MySQL
  db:
    image: mysql:8.0
    container_name: netdocs_db
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: red_infraestructura
      TZ: America/Mexico_City
    volumes:
      - db_data:/var/lib/mysql

  # 3. Administrador de BD (phpMyAdmin)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: netdocs_pma
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: America/Mexico_City
    depends_on:
      - db

volumes:
  db_data: